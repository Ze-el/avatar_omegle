{% extends "base.html" %}
{% block content %}
<h1>Welcome to Babble!</h1>

{% if 'user_id' in session %}
    <p>Welcome, user!</p>
    <a href="{{ url_for('profile') }}">Edit Profile</a><br>
    <a href="{{ url_for('match') }}">Find Matches</a><br>
    <a href="{{ url_for('logout') }}">Logout</a>
{% else %}
    <a href="{{ url_for('login') }}">Login</a><br>
    <a href="{{ url_for('signup') }}">Create an Account</a>
{% endif %}
{% endblock %}
